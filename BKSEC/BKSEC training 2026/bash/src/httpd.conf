ServerRoot "/usr/local/apache2"
Listen 80

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authn_core_module modules/mod_authn_core.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule dir_module modules/mod_dir.so
LoadModule mime_module modules/mod_mime.so

User www-data
Group www-data

ServerAdmin admin@secureshare.pro
ServerName secureshare.pro

ErrorLog /proc/self/fd/2
LogLevel warn rewrite:trace3

<Directory />
    AllowOverride none
    Require all denied
</Directory>

DocumentRoot "/usr/local/apache2/htdocs"

<Directory "/usr/local/apache2/htdocs">
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

<Directory "/opt/storage/files/uploads/public">
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>

DirectoryIndex index.html

# Secure download endpoint with validation
RewriteEngine On
RewriteMap validateDownload prg:/opt/share/bin/validator.sh

# Main download endpoint
RewriteRule ^/dl/v1/([0-9]+)/s:(.*)/(.*\.(pdf|zip|doc|docx|xlsx))$ \
${validateDownload:$2_$1_$3_%{HTTP_HOST}_%{REQUEST_URI}} \
[T=application/octet-stream]

# Static pages
RewriteRule ^/$ /index.html [L]
RewriteRule ^/generate$ /generate.html [L]
