{% extends "base.html" %}

{% block content %}
<div class="login-card">
    <span class="close-modal" onclick="document.getElementById('loginModalOverlay').classList.remove('active')">&times;</span>
    <h2 class="login-title">Đăng nhập</h2>
    
    <div class="office-login-section">
        <p class="office-text">Sử dụng email Office 365 của đại học!</p>
        <button class="office-btn" type="button" disabled>
            <span class="office-icon"></span>
            Office 365
        </button>
    </div>
    
    <div class="divider">
        <span class="divider-text">
            Hoặc đăng nhập bằng:<br>
            <span class="highlight-text">Tài khoản và mật khẩu của hệ thống qldt</span>
        </span>
    </div>
    
    <form id="loginForm" method="POST">
        <div class="form-group">
            <label for="username">Tài khoản <span class="required">*</span></label>
            <input type="text" id="username" name="username" placeholder="Nhập tên tài khoản" required>
        </div>
        
        <div class="form-group">
            <label for="password">Mật khẩu <span class="required">*</span></label>
            <input type="password" id="password" name="password" placeholder="Nhập mật khẩu" required>
        </div>
        
        <a href="#" class="forgot-password">Quên mật khẩu?</a>
        
        <button type="submit" class="login-submit-btn">Đăng nhập</button>
    </form>
</div>
{% endblock %}
